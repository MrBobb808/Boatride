<title>Gangway Check-In</title>
<style>
  :root {
    --bg: #E9EEEC;
    --surface: #FFFFFF;
    --surface-2: #F3F7F5;
    --ink: #0D1A1C;
    --muted: #55696B;
    --line: #CFDAD7;
    --line-strong: #A9BBB7;
    --accent: #C2410C;
    --accent-ink: #FFFFFF;
    --accent-soft: #FBE8DE;
    --aboard: #0F6B4F;
    --aboard-ink: #FFFFFF;
    --aboard-soft: #DBEFE6;
    --alert: #A8261A;
    --alert-soft: #FBE4E1;
    --ev: #47398C;
    --ev-soft: #E9E5F8;
    --header: #0B3D46;
    --header-ink: #EAF3F2;
    --shadow: 0 1px 2px rgba(13, 26, 28, .08), 0 8px 24px -12px rgba(13, 26, 28, .28);
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #091113;
      --surface: #121E20;
      --surface-2: #18272A;
      --ink: #E7F0EE;
      --muted: #90A5A5;
      --line: #24383B;
      --line-strong: #3A5457;
      --accent: #F97316;
      --accent-ink: #1A0D04;
      --accent-soft: #2C1809;
      --aboard: #34D399;
      --aboard-ink: #04241A;
      --aboard-soft: #0D2E25;
      --alert: #F79A90;
      --alert-soft: #3A1714;
      --ev: #A99BF5;
      --ev-soft: #1E1B36;
      --header: #071F24;
      --header-ink: #DCECEA;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -12px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --bg: #091113;
    --surface: #121E20;
    --surface-2: #18272A;
    --ink: #E7F0EE;
    --muted: #90A5A5;
    --line: #24383B;
    --line-strong: #3A5457;
    --accent: #F97316;
    --accent-ink: #1A0D04;
    --accent-soft: #2C1809;
    --aboard: #34D399;
    --aboard-ink: #04241A;
    --aboard-soft: #0D2E25;
    --alert: #F79A90;
    --alert-soft: #3A1714;
    --ev: #A99BF5;
    --ev-soft: #1E1B36;
    --header: #071F24;
    --header-ink: #DCECEA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -12px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 14px 96px;
  }

  /* ---------- header ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header);
    color: var(--header-ink);
    padding: 10px 14px 12px;
    border-bottom: 1px solid rgba(0, 0, 0, .25);
  }

  .topbar-inner { max-width: 640px; margin: 0 auto; }

  .brandline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    opacity: .82;
  }

  .tally {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    letter-spacing: -.01em;
  }

  .tally b { font-size: 20px; font-weight: 700; }
  .tally span { opacity: .6; }

  .meter {
    height: 5px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .16);
    overflow: hidden;
    margin-top: 9px;
  }

  .meter i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: var(--accent);
    transition: width .35s ease;
  }

  /* ---------- search ---------- */

  .searchrow { display: flex; gap: 8px; margin-top: 11px; }

  #q {
    flex: 1;
    min-width: 0;
    font-family: var(--font-num);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12);
  }

  #q::placeholder { color: var(--muted); font-size: 15px; font-family: var(--font-ui); }
  #q:focus { outline: 3px solid var(--accent); outline-offset: 1px; }

  .clearbtn {
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, .14);
    color: var(--header-ink);
    font-size: 15px;
    font-weight: 600;
    padding: 0 16px;
    cursor: pointer;
  }

  .clearbtn:active { transform: scale(.97); }

  /* ---------- tabs ---------- */

  .tabs {
    display: flex;
    gap: 3px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin: 14px 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tabs button {
    flex: 1 0 auto;
    white-space: nowrap;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 650;
    padding: 9px 7px;
    cursor: pointer;
  }

  .tabs button[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- cards ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 12px;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
  }

  .bignum {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.03em;
    flex-shrink: 0;
  }

  .who { min-width: 0; flex: 1; }

  .who h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    text-wrap: balance;
  }

  .who p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 99px;
    white-space: nowrap;
  }

  .pill-aboard { background: var(--aboard-soft); color: var(--aboard); }
  .pill-ev { background: var(--ev-soft); color: var(--ev); }
  .pill-alert { background: var(--alert-soft); color: var(--alert); }
  .pill-paid { background: var(--accent-soft); color: var(--accent); }

  .stripe { height: 4px; }
  .stripe-aboard { background: var(--aboard); }
  .stripe-alert { background: var(--alert); }
  .stripe-ev { background: var(--ev); }

  .note {
    margin: 0;
    padding: 11px 16px;
    font-size: 13.5px;
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    color: var(--muted);
  }

  .note b { color: var(--ink); }

  .act { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }

  button.big {
    width: 100%;
    border: 0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 16px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }

  button.big:active { transform: scale(.985); }
  button.big:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.big.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); }
  button.big.evbtn { background: var(--ev); color: var(--surface); }

  /* ---------- seller rows ---------- */

  .seller {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 13px 14px;
    margin-bottom: 10px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
  }

  .seller:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .seller-main { flex: 1; min-width: 0; }
  .seller-main h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .seller-main p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  .count {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    padding: 6px 10px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }

  .count.done { background: var(--aboard-soft); color: var(--aboard); border-color: transparent; }

  /* ---------- manifest ---------- */

  details.group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  details.group > summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
    list-style: none;
  }

  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  .nums {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 14px 14px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .num {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 600;
    min-width: 52px;
    padding: 9px 6px;
    border-radius: 9px;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }

  .num[data-on="1"] {
    background: var(--aboard);
    color: var(--aboard-ink);
    border-color: transparent;
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }

  .num:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

  /* ---------- misc ---------- */

  h1.title { font-size: 21px; margin: 18px 0 4px; font-weight: 750; letter-spacing: -.01em; }

  .lede { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; }

  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 9px;
  }

  .recent {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .recent:last-child { border-bottom: 0; }
  .recent .rn { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
  .recent .rw { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .rt { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .undo {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 650;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    padding: 26px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
  }

  .flag {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .flag h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .flag p { margin: 0; color: var(--muted); }
  .flag .k { font-family: var(--font-num); font-weight: 700; color: var(--ink); }

  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .stat b {
    display: block;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.1;
  }

  .stat span { font-size: 12.5px; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translate(-50%, 130%);
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: calc(100% - 28px);
    background: var(--header);
    color: var(--header-ink);
    padding: 12px 14px;
    border-radius: 12px;
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .55);
    font-size: 14.5px;
    transition: transform .28s cubic-bezier(.2, .8, .3, 1);
  }

  .toast[data-show="1"] { transform: translate(-50%, 0); }
  .toast button {
    border: 1px solid rgba(255, 255, 255, .35);
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .footer-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .footer-actions button {
    flex: 1;
    min-width: 130px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 650;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  /* ---------- report ---------- */

  .printhead { display: none; }

  .headline {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px;
    margin-bottom: 12px;
    text-align: center;
  }

  .headline b {
    display: block;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 62px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
  }

  .headline span { font-size: 14px; color: var(--muted); }

  .rank { display: flex; flex-direction: column; gap: 2px; }

  .rankrow {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
  }

  .rankrow:nth-child(odd) { background: var(--surface-2); }

  .rankrow .pos {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-align: right;
  }

  .rankrow .nm { min-width: 0; font-size: 15px; font-weight: 600; }
  .rankrow .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

  .rankrow .qty {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    font-weight: 700;
  }

  .bar {
    grid-column: 2 / 4;
    height: 6px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }

  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .rankrow.top .bar i { background: var(--aboard); }
  .rankrow.top .qty { color: var(--aboard); }

  table.rep {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  table.rep th, table.rep td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
  }

  table.rep th {
    font-size: 11.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  table.rep td.n, table.rep th.n {
    text-align: right;
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
  }

  table.rep tr.zero td { color: var(--muted); }
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

  /* ---------- sync ---------- */

  .code {
    font-family: var(--font-num);
    font-size: 12.5px;
    line-height: 1.6;
    word-break: break-all;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    color: var(--ink);
    width: 100%;
    min-height: 96px;
    resize: vertical;
  }

  .code:focus { outline: 3px solid var(--accent); outline-offset: 1px; }

  .warnbox {
    background: var(--alert-soft);
    border: 1px solid transparent;
    border-left: 4px solid var(--alert);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 12px;
    font-size: 14px;
  }

  .warnbox h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--alert); }
  .warnbox p { margin: 0; color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media print {
    .topbar, .tabs, .footer-actions, .toast, .act, .noprint { display: none !important; }
    body { background: #fff; color: #000; font-size: 11pt; }
    .wrap { max-width: none; padding: 0; }
    .card, details.group, .headline, .tablewrap, .flag { break-inside: avoid; box-shadow: none; border-color: #bbb; }
    .rankrow { break-inside: avoid; }
    .rankrow:nth-child(odd) { background: #f2f2f2; }
    details.group > .nums { display: flex !important; }
    .headline b { font-size: 44pt; }
    table.rep th, table.rep td { border-bottom: 1px solid #ccc; padding: 5px 8px; }
    .printhead {
      display: block;
      border-bottom: 2px solid #000;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .printhead h1 { margin: 0; font-size: 19pt; letter-spacing: -.01em; }
    .printhead p { margin: 3px 0 0; font-size: 10pt; color: #444; }
    .eyebrow { color: #444; margin-top: 18px; }
    @page { margin: 14mm; }
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brandline">
      <div class="brand" id="brand">Gangway</div>
      <div class="tally"><b id="tAboard">0</b> <span>aboard of</span> <b id="tExp">0</b></div>
    </div>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="searchrow">
      <input id="q" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Ticket number, or who they bought from" aria-label="Ticket number or seller name">
      <button class="clearbtn" id="clearBtn" type="button">Clear</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="warnbox hidden" id="saveWarn" style="margin-top:14px">
    <h3>This browser is not saving your list</h3>
    <p>Check-ins are being held in memory only. If this page closes or reloads, they are gone. Use the Sync tab to keep
      a copy as you go, or run the check-in somewhere else — Safari usually works when an in-app browser does not.</p>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="checkin">Check in</button>
    <button role="tab" aria-selected="false" data-view="manifest">Manifest</button>
    <button role="tab" aria-selected="false" data-view="report">Report</button>
    <button role="tab" aria-selected="false" data-view="sync">Sync</button>
    <button role="tab" aria-selected="false" data-view="notes">Notes</button>
  </div>

  <section id="view-checkin"></section>
  <section id="view-manifest" class="hidden"></section>
  <section id="view-report" class="hidden"></section>
  <section id="view-sync" class="hidden"></section>
  <section id="view-notes" class="hidden"></section>
</div>

<div class="toast" id="toast" data-show="0">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">Undo</button>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     The ticket book. Each block is a run of numbers given to one person.
     returned = tickets in the block that came back and won't be used.
     ------------------------------------------------------------------ */
  var BLOCKS = [
    { from: 1,   to: 5,   who: "Sis Dimples",    key: "dimples",   note: "Brought money for 4 of the 5." },
    { from: 6,   to: 15,  who: "Darkim",         key: "darkim" },
    { from: 16,  to: 20,  who: "Sis Tessa",      key: "tessa" },
    { from: 21,  to: 25,  who: "Aunty Delly",    key: "delly" },
    { from: 26,  to: 35,  who: "Sis Sharese",    key: "sharese" },
    { from: 36,  to: 40,  who: "Sis Jessica",    key: "jessica" },
    { from: 41,  to: 45,  who: "Sis Pam",        key: "pam",       paid: "Paid" },
    { from: 46,  to: 50,  who: "Sis Joan",       key: "joan" },
    { from: 51,  to: 55,  who: "Sis Jada",       key: "jada" },

    { from: 274, to: 275, who: "Sonia Ruiz",     key: "soniaruiz", ev: true, evStart: 13 },
    { from: 276, to: 276, who: "Sis Shirley",    key: "shirley",   note: "Listed just as “Shirley”." },

      note: "These numbers were never given out. If someone shows one, it did not come from your book — check with them." },
    { from: 326, to: 330, who: "Bro Trevor",     key: "trevor",    sub: "Kids tickets" },
    { from: 331, to: 332, who: "Zion & Eden",    key: "zioneden" },
    { from: 333, to: 333, who: "Sponsored",      key: "sponsored" },
    { from: 334, to: 334, who: "Sis Eugene",     key: "eugene",    sub: "Granddaughter" },
    { from: 335, to: 335, who: "Destinee Clarke", key: "destinee" }
  ];

  var MIN_T = 1, MAX_T = 335;

  /* index: ticket number -> block */
  var byNumber = {};
  BLOCKS.forEach(function (b) {
    for (var n = b.from; n <= b.to; n++) byNumber[n] = b;
  });

  /* index: person -> their blocks */
  var people = [];
  var peopleByKey = {};
  BLOCKS.forEach(function (b) {
    if (b.unissued) return;
    var p = peopleByKey[b.key];
    if (!p) {
      p = { key: b.key, who: b.who, blocks: [], ev: false };
      peopleByKey[b.key] = p;
      people.push(p);
    }
    p.blocks.push(b);
    if (b.ev) p.ev = true;
  });

  people.forEach(function (p) {
    p.numbers = [];
    p.returned = 0;
    p.paid = "";
    p.blocks.forEach(function (b) {
      for (var n = b.from; n <= b.to; n++) p.numbers.push(n);
      p.returned += b.returned || 0;
      if (b.paid) p.paid = b.paid;
    });
    p.expected = p.numbers.length - p.returned;
    p.ranges = p.blocks.map(function (b) {
      return b.from === b.to ? String(b.from) : b.from + "–" + b.to;
    }).join(", ");
    p.search = (p.who + " " + (p.blocks.map(function (b) { return b.sub || ""; }).join(" "))).toLowerCase();
  });

  var TOTAL_ISSUED = 0, TOTAL_RETURNED = 0, TOTAL_EV = 0;
  people.forEach(function (p) {
    TOTAL_ISSUED += p.numbers.length;
    TOTAL_RETURNED += p.returned;
    if (p.ev) TOTAL_EV += p.expected;
  });
  var TOTAL_EXPECTED = TOTAL_ISSUED - TOTAL_RETURNED;

  /* ---------------- state ---------------- */

  var KEY = "gangway-checkin-v1";
  var state = { checked: {}, log: [] };

  /* Some browsers hand out a localStorage that throws, and some hand out
     one that accepts writes and drops them. Prove it round-trips before
     trusting a whole evening's work to it. */
  var storageOK = false;
  var lastSave = null;

  try {
    var probe = KEY + "-probe";
    localStorage.setItem(probe, "ok");
    storageOK = localStorage.getItem(probe) === "ok";
    localStorage.removeItem(probe);
  } catch (e) {
    storageOK = false;
  }

  if (storageOK) {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.checked) state = parsed;
        if (!state.log) state.log = [];
      }
    } catch (e) { /* unreadable record — start clean rather than crash */ }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOK = true;
      lastSave = Date.now();
    } catch (e) {
      storageOK = false;
    }
    paintSaveFlag();
  }

  function isOn(n) { return !!state.checked[n]; }

  function checkIn(n, how) {
    if (isOn(n)) return false;
    state.checked[n] = { at: Date.now(), how: how || "number" };
    state.log.unshift(n);
    if (state.log.length > 60) state.log.pop();
    save();
    return true;
  }

  function undo(n) {
    delete state.checked[n];
    var i = state.log.indexOf(n);
    if (i > -1) state.log.splice(i, 1);
    save();
  }

  function aboardCount() {
    var c = 0;
    for (var k in state.checked) if (state.checked.hasOwnProperty(k)) c++;
    return c;
  }

  function personChecked(p) {
    var c = 0;
    p.numbers.forEach(function (n) { if (isOn(n)) c++; });
    return c;
  }

  function nextFree(p) {
    for (var i = 0; i < p.numbers.length; i++) if (!isOn(p.numbers[i])) return p.numbers[i];
    return null;
  }

  function evLabel(b, n) {
    if (!b.ev) return "";
    if (!b.evStart) return "Eventbrite";
    return "EV" + (b.evStart + (n - b.from));
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function clock(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "pm" : "am";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + (m < 10 ? "0" : "") + m + ap;
  }

  /* ---------------- toast ---------------- */

  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var toastUndo = document.getElementById("toastUndo");
  var toastTimer = null;
  var toastAction = null;

  function say(msg, undoFn) {
    toastMsg.textContent = msg;
    toastAction = undoFn || null;
    toastUndo.style.display = undoFn ? "" : "none";
    toast.setAttribute("data-show", "1");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.setAttribute("data-show", "0"); }, undoFn ? 6000 : 3000);
  }

  toastUndo.addEventListener("click", function () {
    if (toastAction) toastAction();
    toast.setAttribute("data-show", "0");
  });

  /* ---------------- header ---------------- */

  var tAboard = document.getElementById("tAboard");
  var tExp = document.getElementById("tExp");
  var meterFill = document.getElementById("meterFill");

  /* A quiet, always-visible answer to "is this actually being kept?" */
  function paintSaveFlag() {
    var brand = document.getElementById("brand");
    var warn = document.getElementById("saveWarn");
    if (!brand || !warn) return;
    if (!storageOK) {
      brand.textContent = "Not saving";
      brand.style.color = "var(--alert)";
      warn.classList.remove("hidden");
      return;
    }
    warn.classList.add("hidden");
    brand.style.color = "";
    brand.textContent = lastSave ? "Saved " + clock(lastSave) : "Gangway";
  }

  function paintHeader() {
    var a = aboardCount();
    tAboard.textContent = a;
    tExp.textContent = TOTAL_EXPECTED;
    meterFill.style.width = Math.min(100, (a / TOTAL_EXPECTED) * 100) + "%";
  }

  /* ---------------- check-in view ---------------- */

  var q = document.getElementById("q");
  var VIEWS = {
    checkin: document.getElementById("view-checkin"),
    manifest: document.getElementById("view-manifest"),
    report: document.getElementById("view-report"),
    sync: document.getElementById("view-sync"),
    notes: document.getElementById("view-notes")
  };
  var viewCheckin = VIEWS.checkin;
  var viewManifest = VIEWS.manifest;
  var viewNotes = VIEWS.notes;
  var currentView = "checkin";
  var pinned = null;

  function ticketCard(n) {
    var b = byNumber[n];
    var on = isOn(n);
    var rec = state.checked[n];

    if (!b) {
      return '<div class="card"><div class="stripe stripe-alert"></div>' +
        '<div class="card-head"><div class="bignum">' + n + '</div><div class="who">' +
        '<h2>Not in the book</h2><p>Your tickets run ' + MIN_T + '–' + MAX_T + '.</p></div></div>' +
        '<p class="note">Nothing on your list carries this number. Ask who they bought from and look the seller up instead.</p></div>';
    }

    if (b.unissued) {
      return '<div class="card"><div class="stripe stripe-alert"></div>' +
        '<div class="card-head"><div class="bignum">' + n + '</div><div class="who">' +
        '<h2>Never issued</h2><p>' + b.from + '–' + b.to + ' stayed in the book.</p></div></div>' +
        '<p class="note">' + esc(b.note) + '</p></div>';
    }

    var stripe = on ? "stripe-aboard" : (b.ev ? "stripe-ev" : "");
    var pills = [];
    if (on) pills.push('<span class="pill pill-aboard">Aboard ' + clock(rec.at) + "</span>");
    if (b.ev) pills.push('<span class="pill pill-ev">' + esc(evLabel(b, n)) + "</span>");
    if (b.paid) pills.push('<span class="pill pill-paid">' + esc(b.paid) + "</span>");

    var sub = [];
    if (b.sub) sub.push(esc(b.sub));
    sub.push("Block " + b.from + (b.from === b.to ? "" : "–" + b.to));

    var h = '<div class="card">' +
      (stripe ? '<div class="stripe ' + stripe + '"></div>' : "") +
      '<div class="card-head"><div class="bignum">' + n + '</div><div class="who"><h2>' + esc(b.who) + "</h2>" +
      "<p>" + sub.join(" · ") + "</p>" +
      (pills.length ? '<p style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">' + pills.join("") + "</p>" : "") +
      "</div></div>";

    if (b.note) h += '<p class="note">' + esc(b.note) + "</p>";

    h += '<div class="act">';
    if (on) {
      h += '<button class="big ghost" type="button" data-undo="' + n + '">Undo check-in</button>';
    } else if (b.ev) {
      h += '<button class="big evbtn" type="button" data-in="' + n + '">Check in on Eventbrite, then tap here</button>';
    } else {
      h += '<button class="big" type="button" data-in="' + n + '">Check in ticket ' + n + "</button>";
    }
    h += "</div></div>";
    return h;
  }

  function sellerRow(p) {
    var done = personChecked(p);
    var full = done >= p.expected;
    return '<button class="seller" type="button" data-person="' + esc(p.key) + '">' +
      '<div class="seller-main"><h3>' + esc(p.who) + (p.ev ? ' <span class="pill pill-ev">EV</span>' : "") + "</h3>" +
      "<p>" + p.ranges + (p.returned ? " · " + p.returned + " returned" : "") + "</p></div>" +
      '<div class="count' + (full ? " done" : "") + '">' + done + "/" + p.expected + "</div></button>";
  }

  function personCard(p) {
    var done = personChecked(p);
    var left = p.expected - done;
    var nxt = nextFree(p);
    var stripe = left <= 0 ? "stripe-aboard" : (p.ev ? "stripe-ev" : "");

    var h = '<div class="card">' + (stripe ? '<div class="stripe ' + stripe + '"></div>' : "") +
      '<div class="card-head"><div class="who"><h2>' + esc(p.who) + "</h2>" +
      "<p>Tickets " + p.ranges + (p.returned ? " · " + p.returned + " returned, not expected" : "") + "</p>" +
      '<p style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">' +
      '<span class="pill ' + (left <= 0 ? "pill-aboard" : "pill-paid") + '" id="pcPill">' + done + " of " + p.expected + " aboard</span>" +
      (p.paid ? '<span class="pill pill-paid">' + esc(p.paid) + "</span>" : "") +
      (p.ev ? '<span class="pill pill-ev">Eventbrite</span>' : "") +
      "</p></div>" +
      '<div class="bignum" id="pcLeft" data-pc="' + esc(p.key) + '" style="font-size:30px;color:var(--muted)">' + left + "</div></div>";

    var notes = p.blocks.filter(function (b) { return b.note; }).map(function (b) { return b.note; });
    if (notes.length) h += '<p class="note">' + esc(notes.join(" ")) + "</p>";

    h += '<div class="act">';
    if (nxt === null) {
      h += '<p class="note" style="border:0;background:transparent;padding:0">Every number in this block is checked off.</p>';
    } else if (left <= 0) {
      h += '<button class="big ghost" type="button" data-claim="' + esc(p.key) + '">All ' + p.expected +
           " are aboard — check in an extra anyway</button>";
    } else {
      h += '<button class="big" type="button" data-claim="' + esc(p.key) + '">Check off one of ' + esc(p.who) +
           "'s tickets</button>";
    }
    h += '<button class="big ghost" type="button" data-expand="' + esc(p.key) + '">Show the numbers</button>';
    h += "</div>";

    h += '<div class="nums hidden" id="nums-' + esc(p.key) + '">' + numButtons(p) + "</div>";
    h += "</div>";
    return h;
  }

  function numButtons(p) {
    return p.numbers.map(function (n) {
      return '<button class="num" type="button" data-toggle="' + n + '" data-on="' + (isOn(n) ? "1" : "0") + '">' + n + "</button>";
    }).join("");
  }

  function recentList() {
    if (!state.log.length) {
      return '<div class="empty">Nobody checked in yet. Type a ticket number above, or a seller’s name if the guest doesn’t have their number.</div>';
    }
    var h = '<div class="card">';
    state.log.slice(0, 8).forEach(function (n) {
      var b = byNumber[n], rec = state.checked[n];
      if (!rec) return;
      h += '<div class="recent"><span class="rn">' + n + '</span><span class="rw">' +
        esc(b ? b.who : "Unknown") + (rec.how === "seller" ? " · no number" : "") +
        '</span><span class="rt">' + clock(rec.at) + '</span>' +
        '<button class="undo" type="button" data-undo="' + n + '">Undo</button></div>';
    });
    h += "</div>";
    return h;
  }

  function renderCheckin() {
    var term = q.value.trim();
    var h = "";

    if (pinned && peopleByKey[pinned]) {
      viewCheckin.innerHTML =
        '<button class="undo" type="button" data-unpin="1" style="margin-bottom:12px">← Back to results</button>' +
        personCard(peopleByKey[pinned]);
      return;
    }

    if (/^\d+$/.test(term)) {
      h = ticketCard(parseInt(term, 10));
    } else if (/^ev\s*\d+$/i.test(term)) {
      var want = parseInt(term.replace(/[^\d]/g, ""), 10);
      var hit = null;
      BLOCKS.forEach(function (b) {
        if (!b.ev || !b.evStart) return;
        for (var n = b.from; n <= b.to; n++) if (evLabel(b, n).toLowerCase() === "ev" + want) hit = n;
      });
      h = hit ? ticketCard(hit) : '<div class="empty">No EV' + want + " on the list. EV numbers run EV1–EV14.</div>";
    } else if (term.length) {
      var needle = term.toLowerCase();
      var hits = people.filter(function (p) { return p.search.indexOf(needle) > -1; });
      if (!hits.length) {
        h = '<div class="empty">No seller matching “' + esc(term) + '”. Try part of the name, or check the Manifest tab.</div>';
      } else if (hits.length === 1) {
        h = personCard(hits[0]);
      } else {
        h = '<p class="eyebrow" style="margin-top:0">' + hits.length + " sellers match</p>" +
            hits.slice(0, 12).map(sellerRow).join("");
      }
    } else {
      h = '<h1 class="title">Who’s at the gangway?</h1>' +
        '<p class="lede">Type the ticket number. No number — type who they bought from, and check off one of that person’s tickets.</p>' +
        '<p class="eyebrow">Just checked in</p>' + recentList();
    }

    viewCheckin.innerHTML = h;
  }

  /* ---------------- manifest view ---------------- */

  function renderManifest() {
    var aboard = aboardCount();
    var h = '<div class="statgrid" style="margin-bottom:16px">' +
      '<div class="stat"><b>' + aboard + "</b><span>Checked in</span></div>" +
      '<div class="stat"><b>' + Math.max(0, TOTAL_EXPECTED - aboard) + "</b><span>Still to come</span></div>" +
      '<div class="stat"><b>' + TOTAL_EXPECTED + "</b><span>Tickets out</span></div>" +
      '<div class="stat"><b>' + TOTAL_EV + "</b><span>Eventbrite</span></div>" +
      "</div>";

    h += '<p class="eyebrow" style="margin-top:0">Everyone you gave tickets to</p>';

    people.forEach(function (p) {
      var done = personChecked(p);
      var full = done >= p.expected;
      h += '<details class="group" data-group="' + esc(p.key) + '"><summary>' +
        '<div class="seller-main"><h3>' + esc(p.who) + (p.ev ? ' <span class="pill pill-ev">EV</span>' : "") + "</h3>" +
        "<p>" + p.ranges + (p.returned ? " · " + p.returned + " returned" : "") + "</p></div>" +
        '<div class="count' + (full ? " done" : "") + '">' + done + "/" + p.expected + "</div>" +
        '</summary><div class="nums">' + numButtons(p) + "</div></details>";
    });

    var un = BLOCKS.filter(function (b) { return b.unissued; })[0];
    h += '<p class="eyebrow">Still in the book</p>' +
      '<div class="flag"><h3>' + un.from + "–" + un.to + " never issued</h3><p>" +
      (un.to - un.from + 1) + " numbers. " + esc(un.note) + "</p></div>";

    h += '<div class="footer-actions">' +
      '<button type="button" id="copyBtn">Copy a summary</button>' +
      '<button type="button" id="printBtn">Print the manifest</button>' +
      '<button type="button" id="resetBtn">Reset all check-ins</button>' +
      "</div>";

    viewManifest.innerHTML = h;
  }

  /* ---------------- notes view ---------------- */

    ];

    var h = '<h1 class="title">Things to watch</h1>' +
      '<p class="lede">Read once before the first guest arrives.</p>' +
      flags.map(function (f) {
        return '<div class="flag"><h3>' + f[0] + "</h3><p>" + f[1] + "</p></div>";
      }).join("");

    h += '<p class="eyebrow">How the numbers add up</p>' +
      '<div class="statgrid">' +
      '<div class="stat"><b>' + TOTAL_ISSUED + "</b><span>Numbers handed out</span></div>" +
      '<div class="stat"><b>' + TOTAL_RETURNED + "</b><span>Returned, won’t show</span></div>" +

      "</div>";

    h += '<p class="eyebrow">If someone has no number</p>' +
      '<div class="card"><p class="note" style="border:0">Ask who they bought from, type that name in the search box, and tap ' +
      "<b>Check off one of their tickets</b>. The app takes their lowest number that hasn’t been used yet and marks it. " +
      "That keeps the seller’s count honest even though you never learn the guest’s name.</p></div>";

    h += '<p class="eyebrow">Your check-ins are saved on this device</p>' +
      '<div class="card"><p class="note" style="border:0">Everything is stored in this browser, so closing the tab or losing signal ' +
      "won’t lose your list. Use the same phone and the same browser all night. Don’t use private browsing.</p></div>";

    viewNotes.innerHTML = h;
  }

  /* ---------------- render ---------------- */

  /* ------------------------------------------------------------------
     Portable state. The whole board packs into 2 bits per ticket —
     checked, and whether it was claimed through a seller rather than by
     number — so it travels as a short code in a link or a paste.
     ------------------------------------------------------------------ */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

  function packState() {
    var bytes = new Uint8Array(Math.ceil((MAX_T * 2) / 8));
    for (var n = 1; n <= MAX_T; n++) {
      var rec = state.checked[n];
      if (!rec) continue;
      var b = (n - 1) * 2;
      bytes[b >> 3] |= 1 << (b & 7);
      if (rec.how === "seller") bytes[(b + 1) >> 3] |= 1 << ((b + 1) & 7);
    }
    return bytes;
  }

  function toB64(bytes) {
    var out = "";
    for (var i = 0; i < bytes.length; i += 3) {
      var a = bytes[i], b = bytes[i + 1], c = bytes[i + 2];
      out += B64[a >> 2];
      out += B64[((a & 3) << 4) | ((b === undefined ? 0 : b) >> 4)];
      if (b === undefined) break;
      out += B64[((b & 15) << 2) | ((c === undefined ? 0 : c) >> 6)];
      if (c === undefined) break;
      out += B64[c & 63];
    }
    return out;
  }

  var B64IDX = {};
  for (var bi = 0; bi < 64; bi++) B64IDX[B64[bi]] = bi;

  function fromB64(s) {
    var bytes = [], acc = 0, bits = 0;
    for (var i = 0; i < s.length; i++) {
      var v = B64IDX[s[i]];
      if (v === undefined) continue;
      acc = (acc << 6) | v;
      bits += 6;
      if (bits >= 8) { bits -= 8; bytes.push((acc >> bits) & 255); }
    }
    return new Uint8Array(bytes);
  }

  function sumOf(bytes) {
    var s = 0;
    for (var i = 0; i < bytes.length; i++) s = (s + bytes[i] * (i + 1)) % 4093;
    return s;
  }

  function makeCode() {
    var bytes = packState();
    return "G1" + toB64(bytes) + "." + sumOf(bytes).toString(36);
  }

  function readCode(input) {
    var code = String(input || "").replace(/\s+/g, "");
    if (code.indexOf("#") > -1) code = code.slice(code.lastIndexOf("=") + 1);
    if (!code) return { error: "Nothing pasted yet." };
    if (code.slice(0, 2) !== "G1") {
      return { error: "That doesn’t look like a Gangway code — a real one starts with G1." };
    }
    var dot = code.lastIndexOf(".");
    if (dot < 3) return { error: "The code looks cut off. Copy all of it, including the dot near the end." };
    var bytes = fromB64(code.slice(2, dot));
    if (sumOf(bytes).toString(36) !== code.slice(dot + 1)) {
      return { error: "The code didn’t add up, so some of it went missing in the copying. Send it again." };
    }
    return { bytes: bytes };
  }

  /* Merging is a union: a check-in present on either side stays checked.
     Nothing is ever un-checked by a merge, so it is safe to repeat. */
  function mergeBytes(bytes) {
    var added = 0, now = Date.now();
    for (var n = 1; n <= MAX_T; n++) {
      var b = (n - 1) * 2;
      if ((b >> 3) >= bytes.length) break;
      if (!((bytes[b >> 3] >> (b & 7)) & 1)) continue;
      if (state.checked[n]) continue;
      var viaSeller = (bytes[(b + 1) >> 3] >> ((b + 1) & 7)) & 1;
      state.checked[n] = { at: now, how: viaSeller ? "seller" : "number", synced: true };
      state.log.unshift(n);
      added++;
    }
    if (state.log.length > 60) state.log.length = 60;
    if (added) save();
    return added;
  }

  var lastHash = null;

  function writeHash() {
    var code = aboardCount() ? makeCode() : "";
    if (code === lastHash) return;
    lastHash = code;
    try {
      history.replaceState(null, "", code ? "#s=" + code : location.pathname + location.search);
    } catch (e) { /* file:// in some browsers */ }
  }

  function shareLink() {
    return location.origin + location.pathname + location.search + "#s=" + makeCode();
  }

  function markMoved() {
    state.movedAt = Date.now();
    state.movedCount = aboardCount();
    save();
  }

  /* One tap to hand the list to another device: the phone's own share
     sheet (AirDrop, Messages, Notes) where it exists, clipboard where
     it doesn't or where the frame is not allowed to open it. */
  function sendBoard() {
    var url = shareLink();
    var done = function () { markMoved(); if (currentView === "sync") renderSync(); };
    if (navigator.share) {
      navigator.share({ title: "Boat ride check-in", text: "Boat ride check-in — " + aboardCount() + " aboard", url: url })
        .then(function () { done(); say("Sent"); },
              function (err) {
                if (err && err.name === "AbortError") return;
                copyText(url, "Link copied");
                done();
              });
      return;
    }
    copyText(url, "Link copied");
    done();
  }

  /* ---------------- report ---------------- */

  function reportRows() {
    return people.map(function (p) {
      return {
        who: p.who, key: p.key, ev: p.ev, ranges: p.ranges,
        issued: p.numbers.length, expected: p.expected, got: personChecked(p)
      };
    }).sort(function (a, b) {
      return b.got - a.got || b.expected - a.expected || a.who.localeCompare(b.who);
    });
  }

  function arrivalWindow() {
    var times = [];
    for (var k in state.checked) {
      if (state.checked.hasOwnProperty(k)) times.push(state.checked[k].at);
    }
    if (!times.length) return null;
    times.sort(function (a, b) { return a - b; });
    return { first: times[0], last: times[times.length - 1] };
  }

  function renderReport() {
    var aboard = aboardCount();
    var rows = reportRows();
    var brought = rows.filter(function (r) { return r.got > 0; });
    var best = rows.length ? rows[0].got : 0;
    var evAboard = rows.reduce(function (t, r) { return t + (r.ev ? r.got : 0); }, 0);
    var turnout = TOTAL_EXPECTED ? Math.round((aboard / TOTAL_EXPECTED) * 100) : 0;
    var win = arrivalWindow();
    var now = new Date();

    var h = '<div class="printhead"><h1>Boat Ride — Check-In Report</h1><p>' +
      now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }) +
      " · printed " + clock(now.getTime()) + "</p></div>";

    h += '<div class="headline"><b>' + aboard + "</b><span>guests checked in, of " +
      TOTAL_EXPECTED + " tickets out</span></div>";

    h += '<div class="statgrid" style="margin-bottom:6px">' +
      '<div class="stat"><b>' + turnout + '%</b><span>Turnout</span></div>' +
      '<div class="stat"><b>' + Math.max(0, TOTAL_EXPECTED - aboard) + "</b><span>Didn’t show</span></div>" +
      '<div class="stat"><b>' + brought.length + "</b><span>Sellers who brought someone</span></div>" +
      '<div class="stat"><b>' + evAboard + "</b><span>Came via Eventbrite</span></div>" +
      "</div>";

    if (win) {
      h += '<p class="lede" style="margin:10px 2px 0">First guest ' + clock(win.first) +
        ", last guest " + clock(win.last) + ".</p>";
    }

    h += '<p class="eyebrow">Who brought the most</p>';
    if (!brought.length) {
      h += '<div class="empty">Nobody checked in yet, so there’s nothing to rank.</div>';
    } else {
      h += '<div class="rank">' + brought.map(function (r, i) {
        var pct = best ? Math.round((r.got / best) * 100) : 0;
        return '<div class="rankrow' + (i === 0 ? " top" : "") + '">' +
          '<span class="pos">' + (i + 1) + "</span>" +
          '<span class="nm">' + esc(r.who) + "<small>" + r.got + " of " + r.expected +
          " tickets used" + (r.ev ? " · Eventbrite" : "") + "</small></span>" +
          '<span class="qty">' + r.got + "</span>" +
          '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
          "</div>";
      }).join("") + "</div>";
    }

    h += '<p class="eyebrow">Everyone who held tickets</p>' +
      '<div class="tablewrap"><table class="rep"><thead><tr>' +
      "<th>Ticket holder</th><th class=\"n\">Out</th><th class=\"n\">Came</th><th class=\"n\">Missing</th>" +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return '<tr' + (r.got === 0 ? ' class="zero"' : "") + "><td>" + esc(r.who) +
          (r.ev ? " <span class=\"pill pill-ev\">EV</span>" : "") +
          '<br><small style="color:var(--muted)">' + r.ranges + "</small></td>" +
          '<td class="n">' + r.expected + "</td>" +
          '<td class="n">' + r.got + "</td>" +
          '<td class="n">' + Math.max(0, r.expected - r.got) + "</td></tr>";
      }).join("") +
      "</tbody></table></div>";

    var missing = [];
    for (var n = MIN_T; n <= MAX_T; n++) {
      var b = byNumber[n];
      if (b && !b.unissued && !isOn(n)) missing.push(n);
    }
    h += '<p class="eyebrow">Tickets never presented (' + missing.length + ")</p>" +
      '<div class="card"><p class="note" style="border:0">' +
      (missing.length ? missing.join(", ") : "None — every ticket issued was used.") + "</p></div>";

    h += '<div class="footer-actions noprint">' +
      '<button type="button" id="printRep">Print this report</button>' +
      '<button type="button" id="csvRep">Download as a spreadsheet</button>' +
      "</div>";

    VIEWS.report.innerHTML = h;
  }

  function reportCsv() {
    var aboard = aboardCount();
    var rows = reportRows();
    var lines = [];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    lines.push(q("Boat ride check-in report"));
    lines.push(q("Generated") + "," + q(new Date().toLocaleString()));
    lines.push(q("Guests checked in") + "," + aboard);
    lines.push(q("Tickets issued") + "," + TOTAL_EXPECTED);
    lines.push(q("Did not show") + "," + Math.max(0, TOTAL_EXPECTED - aboard));
    lines.push("");
    lines.push(["Ticket holder", "Ticket numbers", "Tickets out", "Came", "Missing", "Eventbrite"].map(q).join(","));
    rows.forEach(function (r) {
      lines.push([r.who, r.ranges, r.expected, r.got, Math.max(0, r.expected - r.got), r.ev ? "yes" : ""]
        .map(q).join(","));
    });
    return lines.join("\r\n");
  }

  function copyText(text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say(okMsg || "Copied"); },
        function () { window.prompt("Copy this:", text); });
    } else {
      window.prompt("Copy this:", text);
    }
  }

  function offerDownload(filename, text) {
    var claudeApi = window.claude;
    if (!claudeApi || typeof claudeApi.use !== "function") { copyText(text, "Copied — paste it into a spreadsheet"); return; }
    Promise.resolve(claudeApi.use("downloads")).then(function (dl) {
      if (!dl) { copyText(text, "Copied — paste it into a spreadsheet"); return; }
      return dl.save({ filename: filename, data: text }).then(function () {
        say("Report saved");
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") return;
        if (code === "extension_not_enabled" || code === "rejected_extension") {
          return dl.save({ filename: filename.replace(/\.[^.]+$/, ".txt"), data: text })
            .then(function () { say("Report saved"); },
                  function () { copyText(text, "Copied — paste it into a spreadsheet"); });
        }
        copyText(text, "Copied — paste it into a spreadsheet");
      });
    }).catch(function () { copyText(text, "Copied — paste it into a spreadsheet"); });
  }

  /* ---------------- sync ---------------- */

  function renderSync() {
    var code = makeCode();
    var aboard = aboardCount();
    var behind = state.movedAt ? aboard - (state.movedCount || 0) : aboard;

    var h = '<h1 class="title">Keeping the list safe</h1>';

    /* Where the list stands right now — the first thing to know. */
    if (!aboard) {
      h += '<div class="card"><p class="note" style="border:0">Nothing checked in yet. Once you start, this tab tells you ' +
        'whether the list exists anywhere other than this browser.</p></div>';
    } else if (!state.movedAt) {
      h += '<div class="warnbox"><h3>This list exists in one place only</h3><p>All ' + aboard + ' check-in' +
        (aboard === 1 ? " is" : "s are") + " saved in this browser and nowhere else. Send a copy to yourself and " +
        "it survives anything that happens to this phone.</p></div>";
    } else if (behind > 0) {
      h += '<div class="warnbox"><h3>' + behind + " check-in" + (behind === 1 ? "" : "s") + " newer than your last copy</h3>" +
        "<p>You last sent a copy at " + clock(state.movedAt) + ", with " + (state.movedCount || 0) +
        " aboard. Send a fresh one to bring it up to date.</p></div>";
    } else {
      h += '<div class="card"><div class="stripe stripe-aboard"></div><p class="note" style="border:0">Copy sent at ' +
        clock(state.movedAt) + " with all " + aboard + " check-ins. Nothing new since.</p></div>";
    }

    h += '<div class="act" style="padding:0 0 6px">' +
      '<button class="big" type="button" id="sendBoard">Send this list to myself</button></div>' +
      '<p class="lede" style="margin:0 0 6px">Opens your phone’s share sheet — AirDrop it, message it, or save it to Notes. ' +
      'Opening that link anywhere brings the check-ins with it.</p>';

    /* Their two actual questions, answered where they will be asked. */
    h += '<p class="eyebrow">If this phone turns off or the app closes</p>';
    if (storageOK) {
      h += '<div class="card"><div class="stripe stripe-aboard"></div><p class="note" style="border:0">' +
        '<b>Your list is still here.</b> This browser has been tested and it is keeping the list: every check-in is ' +
        'written to storage the moment you tap it, not held in memory. Powering off, running the battery flat, or the ' +
        'app closing does not touch it — reopen the same app on this phone and carry on where you stopped. ' +
        (lastSave ? "Last written at " + clock(lastSave) + ". " : "") +
        'What does lose it: clearing your browsing data, or having opened this in private browsing.</p></div>' +
        '<p class="lede" style="margin:10px 2px 0">Worth proving to yourself before the first guest: check one person ' +
        'in, close the app completely, open it again. The count should still be there.</p>';
    } else {
      h += '<div class="warnbox"><h3>Not on this browser, no</h3><p>This one refuses to store anything, so the list ' +
        'lives only as long as the page stays open. Copy the code below after every few guests, or move the whole ' +
        'check-in to Safari, which usually works when an in-app browser will not.</p></div>';
    }

    h += '<p class="eyebrow">If you switch to Safari, or another phone</p>' +
      '<div class="card"><p class="note" style="border:0"><b>The list does not follow you on its own.</b> Every app and ' +
      'every browser keeps its own separate storage, so Safari cannot see what the Claude app recorded, and neither can ' +
      'a second phone. There is no server behind this page to join them up. Send yourself the link and open it there — ' +
      'that carries the whole list across, and you can keep going where you left off.</p></div>';

    h += '<p class="eyebrow">Bring in a list from somewhere else</p>' +
      '<textarea class="code" id="inCode" rows="3" placeholder="Paste a link or a code here"></textarea>' +
      '<div class="footer-actions" style="margin-top:8px">' +
      '<button type="button" id="mergeCode">Merge it in</button>' +
      "</div>" +
      '<p class="lede" style="margin:10px 2px 0">Merging only ever adds. A check-in on either side stays checked and ' +
      'nothing is removed, so it is safe to merge the same thing twice, or to merge in both directions after two of you ' +
      'have worked separate doors.</p>';

    h += '<p class="eyebrow">The code by itself</p>' +
      '<textarea class="code" id="outCode" readonly rows="3">' + code + "</textarea>" +
      '<div class="footer-actions" style="margin-top:8px">' +
      '<button type="button" id="copyCode">Copy the code</button>' +
      '<button type="button" id="copyLink">Copy as a link</button>' +
      "</div>" +
      '<p class="lede" style="margin:10px 2px 0">The whole list in ' + code.length + ' characters. The address in your ' +
      'browser bar also keeps itself up to date, so that address is always a working copy of where you are now.</p>';

    VIEWS.sync.innerHTML = h;
  }

  function render() {
    paintHeader();
    paintSaveFlag();
    writeHash();
    if (currentView === "checkin") renderCheckin();
    else if (currentView === "manifest") renderManifest();
    else if (currentView === "report") renderReport();
    else if (currentView === "sync") renderSync();
    else renderNotes();
  }

  /* ---------------- events ---------------- */

  function showView(name) {
    currentView = name;
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-view") === name ? "true" : "false");
    });
    Object.keys(VIEWS).forEach(function (k) {
      VIEWS[k].classList.toggle("hidden", k !== name);
    });
  }

  document.querySelectorAll(".tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      showView(btn.getAttribute("data-view"));
      render();
      window.scrollTo(0, 0);
    });
  });

  var typeTimer = null;
  q.addEventListener("input", function () {
    if (currentView !== "checkin") showView("checkin");
    pinned = null;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(render, 60);
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    q.value = "";
    pinned = null;
    render();
    q.focus();
  });

  q.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    var term = q.value.trim();
    if (/^\d+$/.test(term)) {
      var n = parseInt(term, 10);
      var b = byNumber[n];
      if (b && !b.unissued && !isOn(n)) doCheckIn(n, "number");
    }
    q.blur();
  });

  function doCheckIn(n, how) {
    if (!checkIn(n, how)) return;
    var b = byNumber[n];
    say("Ticket " + n + " · " + (b ? b.who : "") + " aboard", function () {
      undo(n);
      render();
      say("Ticket " + n + " put back");
    });
    render();
  }

  document.body.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;

    var inN = t.getAttribute("data-in");
    if (inN) { doCheckIn(parseInt(inN, 10), "number"); return; }

    var unN = t.getAttribute("data-undo");
    if (unN) {
      undo(parseInt(unN, 10));
      render();
      say("Ticket " + unN + " put back");
      return;
    }

    var tog = t.getAttribute("data-toggle");
    if (tog) {
      var tn = parseInt(tog, 10);
      if (isOn(tn)) { undo(tn); say("Ticket " + tn + " put back"); }
      else { checkIn(tn, "number"); say("Ticket " + tn + " aboard"); }
      /* repaint in place so an open <details> stays open */
      t.setAttribute("data-on", isOn(tn) ? "1" : "0");
      paintHeader();
      document.querySelectorAll('[data-toggle="' + tn + '"]').forEach(function (el) {
        el.setAttribute("data-on", isOn(tn) ? "1" : "0");
      });
      refreshCounts();
      return;
    }

    var claim = t.getAttribute("data-claim");
    if (claim) {
      var p = peopleByKey[claim];
      var n = nextFree(p);
      if (n === null) { say("No numbers left in " + p.who + "'s block"); return; }
      checkIn(n, "seller");
      say("Ticket " + n + " · one of " + p.who + "'s", function () {
        undo(n);
        render();
        say("Ticket " + n + " put back");
      });
      render();
      return;
    }

    var pk = t.getAttribute("data-person");
    if (pk && peopleByKey[pk]) {
      pinned = pk;
      render();
      window.scrollTo(0, 0);
      return;
    }

    if (t.getAttribute("data-unpin")) { pinned = null; render(); return; }

    var exp = t.getAttribute("data-expand");
    if (exp) {
      var box = document.getElementById("nums-" + exp);
      if (box) {
        box.classList.toggle("hidden");
        t.textContent = box.classList.contains("hidden") ? "Show the numbers" : "Hide the numbers";
      }
      return;
    }

    if (t.id === "printBtn" || t.id === "printRep") { window.print(); return; }

    if (t.id === "csvRep") {
      offerDownload("boat-ride-check-in-report.csv", reportCsv());
      return;
    }

    if (t.id === "sendBoard") { sendBoard(); return; }

    if (t.id === "copyCode") { copyText(makeCode(), "Code copied"); markMoved(); renderSync(); return; }

    if (t.id === "copyLink") { copyText(shareLink(), "Link copied"); markMoved(); renderSync(); return; }

    if (t.id === "mergeCode") {
      var box = document.getElementById("inCode");
      var res = readCode(box ? box.value : "");
      if (res.error) { say(res.error); return; }
      var added = mergeBytes(res.bytes);
      if (box) box.value = "";
      render();
      say(added ? "Added " + added + " check-in" + (added === 1 ? "" : "s") + " from the other device"
                : "Nothing new — this device already had all of those");
      return;
    }

    if (t.id === "resetBtn") {
      if (window.confirm("Clear every check-in and start over? This cannot be undone.")) {
        state = { checked: {}, log: [] };
        save();
        render();
        say("Board cleared");
      }
      return;
    }

    if (t.id === "copyBtn") {
      var lines = ["Boat ride check-in — " + aboardCount() + " of " + TOTAL_EXPECTED + " aboard", ""];
      people.forEach(function (p) {
        var d = personChecked(p);
        lines.push(p.who + ": " + d + "/" + p.expected + " (" + p.ranges + ")");
      });
      var missing = [];
      for (var n2 = MIN_T; n2 <= MAX_T; n2++) {
        var bb = byNumber[n2];
        if (bb && !bb.unissued && !isOn(n2)) missing.push(n2);
      }
      lines.push("", "Not yet checked in (" + missing.length + "): " + missing.join(", "));
      copyText(lines.join("\n"), "Summary copied");
      return;
    }
  });

  function refreshCounts() {
    people.forEach(function (p) {
      var done = personChecked(p);
      document.querySelectorAll('[data-person="' + p.key + '"] .count').forEach(function (el) {
        el.textContent = done + "/" + p.expected;
        el.classList.toggle("done", done >= p.expected);
      });
    });
    document.querySelectorAll("details.group").forEach(function (d) {
      var p = peopleByKey[d.getAttribute("data-group")];
      if (!p) return;
      var done = personChecked(p);
      var c = d.querySelector(".count");
      if (!c) return;
      c.textContent = done + "/" + p.expected;
      c.classList.toggle("done", done >= p.expected);
    });

    /* the open person card's own running figures */
    var pcLeft = document.getElementById("pcLeft");
    var pcPill = document.getElementById("pcPill");
    if (pcLeft && pcPill) {
      var pc = peopleByKey[pcLeft.getAttribute("data-pc")];
      if (pc) {
        var d2 = personChecked(pc);
        pcLeft.textContent = Math.max(0, pc.expected - d2);
        pcPill.textContent = d2 + " of " + pc.expected + " aboard";
        pcPill.className = "pill " + (d2 >= pc.expected ? "pill-aboard" : "pill-paid");
      }
    }
  }

  /* A link can carry a list. Merging it in is additive, so opening a
     shared address never costs this device anything it already had. */
  function takeFromHash() {
    var m = (location.hash || "").match(/[#&]s=([^&]+)/);
    if (!m) return null;
    if (m[1] === lastHash) return null;
    var res = readCode(m[1]);
    if (res.error) return res.error;
    var added = mergeBytes(res.bytes);
    return added ? "Picked up " + added + " check-in" + (added === 1 ? "" : "s") + " from the link" : null;
  }

  /* Pasting a link into a tab that already has the app open only changes
     the hash — the browser does not reload, so listen for it directly. */
  window.addEventListener("hashchange", function () {
    var msg = takeFromHash();
    lastHash = null;
    render();
    if (msg) say(msg);
  });

  var bootMsg = takeFromHash();
  render();
  if (bootMsg) say(bootMsg);
})();
</script>
