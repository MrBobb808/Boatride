# Builds Remnant: Ascension and publishes it to GitHub Pages so it can be
# opened on an iPhone and added to the Home Screen.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Remnant — deploy to GitHub Pages

on:
  push:
    paths:
      - 'remnant/**'
      - '.github/workflows/remnant-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remnant-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remnant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remnant/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/update.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - run: node scripts/combat-gauntlet.mjs
      - run: node scripts/skills-echoes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remnant-browser-checks
          path: remnant/qa
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: remnant/dist

  deploy:
    needs: build
    # Pages only accepts deployments from the default branch; other branches just get a build check.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
