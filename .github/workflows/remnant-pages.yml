# Builds Remnant: Ascension and publishes it to GitHub Pages so it can be
# opened on an iPhone and added to the Home Screen.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Remnant — deploy to GitHub Pages

on:
  push:
    paths:
      - 'remnant/**'
      - 'remnant-phaser/**'
      - '.github/workflows/remnant-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remnant-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remnant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remnant/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/update.test.mjs scripts/frame-budget.test.mjs scripts/hero-motion.test.mjs scripts/combat-feedback.test.mjs scripts/squad-systems.test.mjs scripts/progression.test.mjs scripts/audio.test.mjs scripts/power-walls.test.mjs scripts/fallen-chapters.test.mjs scripts/soundtrack.test.mjs
      - run: node scripts/hero-visuals.mjs
      - run: node scripts/smoke.mjs
      - run: node scripts/combat-input.mjs
      - run: node scripts/combat-gauntlet.mjs
      - run: node scripts/skills-echoes.mjs
      - run: node scripts/endless-progression.mjs
      - run: node scripts/wave-access.mjs
      - run: node scripts/squad-expansion.mjs
      - run: node scripts/replay-progression.mjs
      - run: node scripts/background-audio.mjs
      - run: node scripts/power-walls.mjs
      - run: node scripts/fallen-campaign.mjs
      - run: node scripts/boss-rush.mjs
      - run: node scripts/valor-daily.mjs
      - run: node scripts/extreme-survival.mjs
      - run: node scripts/hud-layout.mjs
      - run: node scripts/travel-camera.mjs
      - run: node scripts/fallen-foes.mjs
      - run: node scripts/settlement.mjs
      - run: node scripts/grecia-boss.mjs
      - run: node scripts/swim.mjs
      - run: node scripts/update-delivery.mjs
      - run: node scripts/touch-layout.mjs
      - run: node scripts/transitions.mjs
      - run: node scripts/curve-onboarding.mjs
      - run: node scripts/audio-cinema.mjs
      - run: node scripts/soundtrack.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-browser-checks
          path: remnant/qa
      - uses: actions/upload-artifact@v4
        with:
          name: original-dist
          path: remnant/dist
          retention-days: 1

  phaser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remnant-phaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remnant-phaser/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - run: node scripts/menu.mjs
      - run: node scripts/journey.mjs
      - run: node scripts/story-flow.mjs
      - run: node scripts/modes-water.mjs
      - run: node scripts/phone-progress.mjs
      - run: node scripts/pacing.mjs
      - run: node scripts/action-kit.mjs
      - run: node scripts/animation-motion.mjs
      - run: node scripts/equipment-visuals.mjs
      - run: node scripts/visuals.mjs
      - run: node scripts/combat.mjs
      - run: node scripts/combat-moves.mjs
      - run: node scripts/combat-feel.mjs
      - run: node scripts/archer.mjs
      - run: node scripts/archer-craft.mjs
      - run: node scripts/archer-kit.mjs
      - run: node scripts/sound-pass.mjs
      - run: node scripts/tirzah-progression.mjs
      - run: node scripts/tirzah-dagger.mjs
      - run: node scripts/facing.mjs
      - run: node scripts/powers.mjs
      - run: node scripts/foes.mjs
      - run: node scripts/saves.mjs
      - run: node scripts/economy.mjs
      - run: node scripts/echoes.mjs
      - run: node scripts/echo-bond.mjs
      - run: node scripts/partner.mjs
      - run: node scripts/bosses.mjs
      - run: node scripts/classic-bosses.mjs
      - run: node scripts/install-audio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phaser-browser-checks
          path: remnant-phaser/qa
      - uses: actions/upload-artifact@v4
        with:
          name: phaser-dist
          path: remnant-phaser/dist
          retention-days: 1

  build:
    needs: [original, phaser]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remnant-phaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remnant-phaser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: original-dist
          path: remnant/dist
      - uses: actions/download-artifact@v4
        with:
          name: phaser-dist
          path: remnant-phaser/dist
      - run: node remnant-phaser/scripts/assemble-pages.mjs
        working-directory: .
      - run: node scripts/cutover.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutover-browser-checks
          path: remnant-phaser/qa
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: remnant/dist-pages

  deploy:
    needs: build
    # Pages only accepts deployments from the default branch; other branches just get a build check.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
